name: Auto Unzip and Build Test Mitra APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Check and Extract ZIP if exists
        run: |
          echo "Checking for ZIP files in repository..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d .
            # If extracted into a nested folder, move files to root
            if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
              NESTED_DIR=$(find . -maxdepth 2 -type d -name "*Test*" -o -type d -name "*mitra*" -o -type d -name "*app*" | head -n 1)
              if [ -n "$NESTED_DIR" ] && [ -f "$NESTED_DIR/build.gradle.kts" ]; then
                echo "Moving files from nested folder $NESTED_DIR to root..."
                cp -r "$NESTED_DIR"/* .
              fi
            fi
            echo "Extraction completed successfully!"
          else
            echo "No zip file found, building directly from repository source code."
          fi

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Setup Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: 🚀 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📤 Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: TestMitra-Latest-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
