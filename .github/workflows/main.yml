name: Auto Unzip and Build Test Mitra APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. FIND AND EXTRACT ZIP
      # ==========================================
      - name: 📦 Extract Test Mitra ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching for ZIP file..."
          echo "=========================================="

          ZIP_FILE=$(find . -type f -name "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            echo "Using repository files directly."
          else
            echo "ZIP found:"
            echo "$ZIP_FILE"

            mkdir -p extracted

            echo "Extracting ZIP..."
            unzip -o "$ZIP_FILE" -d extracted

            echo "Extraction completed."

            echo "Searching for Android project..."

            PROJECT_DIR=$(find extracted \
              -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -printf '%h\n' \
              | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR=$(find extracted \
                -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                -printf '%h\n' \
                | head -n 1)
            fi

            if [ -n "$PROJECT_DIR" ]; then
              echo "Android project found at:"
              echo "$PROJECT_DIR"

              cp -a "$PROJECT_DIR"/. .

            else
              echo "Project appears to be at ZIP root."
              cp -a extracted/. .
            fi
          fi


      # ==========================================
      # 3. SHOW PROJECT STRUCTURE
      # ==========================================
      - name: 🔍 Check Android Project
        shell: bash
        run: |
          echo "=========================================="
          echo "Project files:"
          echo "=========================================="

          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -print


      # ==========================================
      # 4. SETUP JAVA 17
      # ==========================================
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle


      # ==========================================
      # 5. FIX GRADLE WRAPPER TO 9.3.1
      # ==========================================
      - name: 🔧 Configure Gradle 9.3.1
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Configuring Gradle 9.3.1"
          echo "=========================================="

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Existing Gradle wrapper found."

            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties

          else

            echo "Gradle wrapper not found."

            echo "Generating Gradle wrapper 9.3.1..."

            gradle wrapper --gradle-version 9.3.1

          fi

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties


      # ==========================================
      # 6. VERIFY GRADLE VERSION
      # ==========================================
      - name: 🧪 Verify Gradle
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version


      # ==========================================
      # 7. CLEAN PROJECT
      # ==========================================
      - name: 🧹 Clean Project
        shell: bash
        run: |
          set -e

          ./gradlew clean --no-daemon


      # ==========================================
      # 8. BUILD DEBUG APK
      # ==========================================
      - name: 🚀 Build Test Mitra Debug APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Building TEST MITRA APK"
          echo "=========================================="

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon


      # ==========================================
      # 9. FIND APK
      # ==========================================
      - name: 🔍 Find Generated APK
        shell: bash
        run: |
          echo "=========================================="
          echo "Searching for generated APK..."
          echo "=========================================="

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # 10. UPLOAD APK
      # ==========================================
      - name: 📤 Upload Test Mitra APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-Latest-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
